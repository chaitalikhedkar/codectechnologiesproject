<!DOCTYPE html>
<html>
<head>
<title>Video Streaming Platform</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.container{
background:#222;
padding:30px;
width:300px;
margin:auto;
margin-top:120px;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:10px;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
background:#ff4444;
color:white;
border:none;
border-radius:5px;
}
</style>

</head>

<body>

<div class="container">

<h2>Video Streaming Platform</h2>

<form action="/login" method="post">

<input type="text" name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<button type="submit">Login</button>

</form>

<br>

<a href="/register" style="color:#ff4444;">Create Account</a>

</div>

</body>
</html>
